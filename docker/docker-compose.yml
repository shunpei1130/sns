version: '3.9'
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  api:
    build: ../api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
      - PORT=8080
    ports:
      - '8080:8080'
    depends_on:
      - db
      - redis
